<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96" role="img" aria-labelledby="ss-title">
  <title id="ss-title">SpeedSpin</title>
  <defs>
    <!-- Subtle vertical gradient on the reel window implies a cylinder. -->
    <linearGradient id="reel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A7FC1"/>
      <stop offset="58%" stop-color="#2F5FA8"/>
      <stop offset="100%" stop-color="#26508F"/>
    </linearGradient>
  </defs>

  <!-- Transparent background: place on dark or light. "SPEED" uses
       currentColor so a single fill swap covers both. -->
  <g fill="currentColor" color="#0A0C11">
    <text x="0" y="66" font-family="'Instrument Sans','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="64" font-weight="800" letter-spacing="-0.6">SPEED</text>
  </g>

  <g transform="translate(202 18)">
    <rect width="206" height="60" rx="8" fill="url(#reel)"/>
    <!-- Hairline reel positions -->
    <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5">
      <path d="M51.5 0v60"/>
      <path d="M103 0v60"/>
      <path d="M154.5 0v60"/>
    </g>
    <g fill="#FFFFFF" font-family="'Instrument Sans','Helvetica Neue',Helvetica,Arial,sans-serif"
       font-size="42" font-weight="800" text-anchor="middle">
      <text x="26" y="44">S</text>
      <text x="77" y="44">P</text>
      <text x="128.5" y="44">I</text>
      <text x="180" y="44">N</text>
    </g>
  </g>
</svg>
